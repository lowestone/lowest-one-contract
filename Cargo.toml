[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Optimize for size: the program's rent deposit scales with its size (504 KB instead of
# 597 KB saves ~0.65 SOL locked, and as much again during the deploy), at the cost of a few
# more compute units per transaction.
opt-level = "z"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
